<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduManage - لوحة تحكم الإدارة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 1rem;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            background: var(--surface);
            padding: 1.5rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        .users-table-container {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 1.5rem;
            overflow-x: auto;
        }
        .admin-actions {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

    <!-- 1. صفحة تسجيل الدخول للمدير -->
    <div id="page-login" class="page active">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <div class="logo-icon"><i class="fas fa-shield-alt"></i></div>
                    <h2>لوحة تحكم الإدارة</h2>
                    <p>تسجيل الدخول للمديرين فقط</p>
                </div>
                <form id="admin-login-form">
                    <div class="form-group">
                        <label for="admin-username">اسم المستخدم</label>
                        <div class="input-with-icon">
                            <i class="fas fa-user"></i>
                            <input type="text" id="admin-username" placeholder="admin" required>
                        </div>
                    </div>
                    <div class="form-group" style="margin-top: 1rem;">
                        <label for="admin-password">كلمة المرور</label>
                        <div class="input-with-icon">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="admin-password" placeholder="كلمة المرور" required>
                        </div>
                        <span class="error-msg" id="admin-login-error">بيانات الدخول غير صحيحة</span>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.5rem;">دخول كمسؤول</button>
                </form>
            </div>
        </div>
    </div>

    <!-- لوحة التحكم -->
    <div id="app-layout" class="app-container hidden" style="display: block; grid-template-columns: 1fr;">
        <div class="admin-container">
            <div class="admin-header">
                <div>
                    <h2><i class="fas fa-users-cog"></i> إدارة النظام والمستخدمين</h2>
                    <p class="text-muted">مرحباً <span id="admin-name"></span></p>
                </div>
                <button id="btn-admin-logout" class="btn btn-outline text-danger"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</button>
            </div>

            <div class="users-table-container">
                <div class="admin-actions">
                    <button class="btn btn-primary" onclick="openModal('modal-user')"><i class="fas fa-plus"></i> إضافة مستخدم جديد (معلم)</button>
                </div>
                
                <table class="table" id="users-table">
                    <thead>
                        <tr>
                            <th>الرقم</th>
                            <th>اسم المستخدم</th>
                            <th>الدور (Role)</th>
                            <th>الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- سيتم إضافته بواسطة JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- نافذة إدارة المستخدم -->
    <div id="modal-user" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="user-modal-title">إضافة مستخدم جديد</h3>
                <button class="btn-icon close-modal"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <form id="user-form">
                    <input type="hidden" id="edit-user-id">
                    <div class="form-group">
                        <label>اسم المستخدم</label>
                        <input type="text" id="user-username" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>كلمة المرور (اتركها فارغة إذا لم ترد التغيير)</label>
                        <input type="password" id="user-password" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>الدور</label>
                        <select id="user-role" class="form-control">
                            <option value="user">معلم (User)</option>
                            <option value="admin">مسؤول (Admin)</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">حفظ</button>
                </form>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
